services:
  - type: web
    name: smartpoultry
    env: python
    healthCheckPath: /__health/
    # Free-plan default: exported ONNX models, with no PyTorch model imports.
    buildCommand: pip install -r requirements.txt && python smartpoultry/manage.py collectstatic --noinput
    startCommand: cd smartpoultry && python manage.py migrate && gunicorn --config gunicorn.conf.py core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      # Required: the app refuses to start on Render without it.
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # Optional Gemini assistance uses GEMINI_API_KEY from the dashboard.
      # Without a key the manual outline/base/tip editor still works.
      - key: GEMINI_SPUR_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: DATABASE_URL
        fromDatabase:
          name: smartpoultry-db
          property: connectionString

databases:
  - name: smartpoultry-db
    databaseName: smartpoultry
    user: smartpoultry
