<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SMARTPOULTRY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            display: grid;
            place-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #eef5ff 0%, #ffffff 55%, #edf6ff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .login-page {
            width: min(460px, calc(100vw - 32px));
            overflow: hidden;
            border: 1px solid #1f6fe5;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(28, 84, 160, 0.16);
        }

        .login-container {
            padding: 36px 32px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .login-logo {
            width: 88px;
            height: 88px;
            display: block;
            margin: -4px auto 18px;
            border-radius: 18px;
            object-fit: contain;
            background: #fff;
            box-shadow: 0 10px 24px rgba(8, 35, 63, 0.15);
        }

        .login-header h1 {
            margin-bottom: 6px;
            color: #08233f;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        .login-header p {
            margin: 0;
            color: #52627a;
            font-size: 0.86rem;
        }

        .btn-primary {
            background: #0b6ee8;
            border-color: #0b6ee8;
        }

        .form-control {
            border-color: #d8e4f5;
        }

        .small-link {
            font-size: 0.78rem;
        }

    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <img src="{% static 'images/smartpoultry_logo.svg' %}" alt="SMARTPOULTRY logo" class="login-logo">
                <h1>SMARTPOULTRY</h1>
                <p>Machine Learning-Based Poultry Farm Financial Analytics System</p>
            </div>

            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
            {% endfor %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small-link" for="remember">Remember me</label>
                    </div>
                    <a class="small-link" href="{% url 'forgot_password' %}">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                <a href="{% url 'register' %}" class="btn btn-outline-primary w-100">Create Account</a>
            </form>

            {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
