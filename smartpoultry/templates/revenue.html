{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Revenue Tracking</h1>

<div class="row mb-4">
    <div class="col-md-8">
    </div>
    <div class="col-md-4 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRevenueModal">
            <i class="bi bi-plus-circle"></i> Add Revenue
        </button>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Total Revenue</h5>
                <h2 id="totalRevenue">₱0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Average Transaction</h5>
                <h2 id="avgRevenue">₱0</h2>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h5>Revenue Records</h5>
    </div>
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Branch</th>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Price/Unit</th>
                    <th>Total Amount</th>
                </tr>
            </thead>
            <tbody id="revenueBody">
            </tbody>
        </table>
    </div>
</div>

<!-- Add Revenue Modal -->
<div class="modal fade" id="addRevenueModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Revenue</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addRevenueForm">
                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select class="form-select" name="branch">
                            <option value="">Unassigned</option>
                            {% for branch in branches %}
                                <option value="{{ branch.id }}">{{ branch.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Available production</label>
                        <select class="form-select" name="production" required></select>
                        <small id="productionAvailable" class="text-muted"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" name="quantity" min="0.01" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price per Unit</label>
                        <input type="number" class="form-control" name="price_per_unit" min="0" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>
                </form>
                <p id="revenueError" class="text-danger" role="alert"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="saveRevenueBtn">Save Revenue</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const revenueForm = document.getElementById('addRevenueForm');
    let productionStock = [];
    function updateProductionChoices() {
        const selected = revenueForm.elements.production.value;
        const options = productionStock.filter(item => String(item.branch || '') === revenueForm.elements.branch.value);
        revenueForm.elements.production.replaceChildren(new Option(options.length ? 'Choose production stock...' : 'No available production for this branch', ''));
        options.forEach(item => revenueForm.elements.production.add(new Option(`${item.product} - ${item.flock} - ${item.date} - ${item.available_quantity} available`,item.id)));
        if (options.some(item => String(item.id) === selected)) revenueForm.elements.production.value = selected;
        updateAvailableQuantity();
    }
    function updateAvailableQuantity() {
        const item = productionStock.find(item => String(item.id) === revenueForm.elements.production.value);
        revenueForm.elements.quantity.max = item ? item.available_quantity : '';
        revenueForm.elements.date.min = item ? item.date : '';
        document.getElementById('productionAvailable').textContent = item ? `Available to sell: ${item.available_quantity}` : '';
    }
    async function loadProductionStock() {
        try {
            const response = await fetch('/api/revenue/available-production/');
            if (!response.ok) throw new Error('Unable to load production stock.');
            productionStock = await response.json();
            updateProductionChoices();
        } catch (error) { document.getElementById('revenueError').textContent = error.message; }
    }
    revenueForm.elements.branch.addEventListener('change', updateProductionChoices);
    revenueForm.elements.production.addEventListener('change', updateAvailableQuantity);
    document.getElementById('addRevenueModal').addEventListener('show.bs.modal', loadProductionStock);
    function loadRevenue() {
        fetch('/api/revenue/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('revenueBody');
                tbody.innerHTML = '';
                let total = 0;
                const results = data.results || [];
                
                const records = (results || []).slice().sort((a, b) => {
                    const branchA = (a.branch_name || 'Unassigned').toLowerCase();
                    const branchB = (b.branch_name || 'Unassigned').toLowerCase();
                    if (branchA !== branchB) return branchA.localeCompare(branchB);
                    return new Date(b.date) - new Date(a.date);
                });

                let currentBranch = null;
                records.forEach(revenue => {
                    const branchName = revenue.branch_name || 'Unassigned';
                    if (currentBranch !== branchName) {
                        currentBranch = branchName;
                        const header = document.createElement('tr');
                        header.className = 'table-light';
                        header.innerHTML = `<td colspan="6"><strong>${branchName}</strong></td>`;
                        tbody.appendChild(header);
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${branchName}</td>
                        <td>${new Date(revenue.date).toLocaleDateString()}</td>
                        <td>${revenue.revenue_type}</td>
                        <td>${revenue.quantity}</td>
                        <td>₱${parseFloat(revenue.price_per_unit).toFixed(2)}</td>
                        <td>₱${parseFloat(revenue.total_amount).toFixed(2)}</td>
                    `;
                    tbody.appendChild(row);
                    total += parseFloat(revenue.total_amount);
                });
                
                document.getElementById('totalRevenue').textContent = '₱' + total.toFixed(2);
                document.getElementById('avgRevenue').textContent = '₱' + (results.length > 0 ? (total / results.length).toFixed(2) : 0);
            });
    }

    document.getElementById('saveRevenueBtn').addEventListener('click', function() {
        const form = document.getElementById('addRevenueForm');
        if (!form.reportValidity()) return;
        document.getElementById('revenueError').textContent = '';
        this.disabled = true;
        const formData = new FormData(form);
        
        fetch('/api/revenue/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                production: parseInt(formData.get('production')),
                quantity: parseFloat(formData.get('quantity')),
                price_per_unit: parseFloat(formData.get('price_per_unit')),
                date: formData.get('date')
            })
        })
        .then(async response => {
            const data = await response.json();
            if (!response.ok) throw new Error(Object.entries(data).map(([field,value]) => `${field}: ${value}`).join('; '));
            return data;
        })
        .then(data => {
            bootstrap.Modal.getInstance(document.getElementById('addRevenueModal')).hide();
            loadRevenue();
            form.reset();
            loadProductionStock();
        })
        .catch(error => { document.getElementById('revenueError').textContent = error.message; })
        .finally(() => { this.disabled = false; });
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.addEventListener('DOMContentLoaded', loadRevenue);
</script>
{% endblock %}
