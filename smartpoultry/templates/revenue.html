{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Revenue Tracking</h1>

<div class="row mb-4">
    <div class="col-md-8">
    </div>
    <div class="col-md-4 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRevenueModal">
            <i class="bi bi-plus-circle"></i> Add Revenue
        </button>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Total Revenue</h5>
                <h2 id="totalRevenue">₱0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Average Transaction</h5>
                <h2 id="avgRevenue">₱0</h2>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h5>Revenue Records</h5>
    </div>
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Branch</th>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                    <th>Price/Unit</th>
                    <th>Total Amount</th>
                </tr>
            </thead>
            <tbody id="revenueBody">
            </tbody>
        </table>
    </div>
</div>

<!-- Add Revenue Modal -->
<div class="modal fade" id="addRevenueModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Revenue</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addRevenueForm">
                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select class="form-select" name="branch" required>
                            <option value="">Choose branch...</option>
                            {% for branch in branches %}
                                <option value="{{ branch.id }}">{{ branch.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Revenue Type</label>
                        <select class="form-select" name="revenue_type" required>
                            <option value="eggs">Eggs</option>
                            <option value="meat">Meat</option>
                            <option value="birds">Birds</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" name="quantity" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Unit</label>
                        <input type="text" class="form-control" name="unit" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price per Unit</label>
                        <input type="number" class="form-control" name="price_per_unit" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="saveRevenueBtn">Save Revenue</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    function loadRevenue() {
        fetch('/api/revenue/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('revenueBody');
                tbody.innerHTML = '';
                let total = 0;
                const results = data.results || [];
                
                const records = (results || []).slice().sort((a, b) => {
                    const branchA = (a.branch_name || 'Unassigned').toLowerCase();
                    const branchB = (b.branch_name || 'Unassigned').toLowerCase();
                    if (branchA !== branchB) return branchA.localeCompare(branchB);
                    return new Date(b.date) - new Date(a.date);
                });

                let currentBranch = null;
                records.forEach(revenue => {
                    const branchName = revenue.branch_name || 'Unassigned';
                    if (currentBranch !== branchName) {
                        currentBranch = branchName;
                        const header = document.createElement('tr');
                        header.className = 'table-light';
                        header.innerHTML = `<td colspan="7"><strong>${branchName}</strong></td>`;
                        tbody.appendChild(header);
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${branchName}</td>
                        <td>${new Date(revenue.date).toLocaleDateString()}</td>
                        <td>${revenue.revenue_type}</td>
                        <td>${revenue.quantity}</td>
                        <td>${revenue.unit}</td>
                        <td>₱${parseFloat(revenue.price_per_unit).toFixed(2)}</td>
                        <td>₱${parseFloat(revenue.total_amount).toFixed(2)}</td>
                    `;
                    tbody.appendChild(row);
                    total += parseFloat(revenue.total_amount);
                });
                
                document.getElementById('totalRevenue').textContent = '₱' + total.toFixed(2);
                document.getElementById('avgRevenue').textContent = '₱' + (results.length > 0 ? (total / results.length).toFixed(2) : 0);
            });
    }

    document.getElementById('saveRevenueBtn').addEventListener('click', function() {
        const form = document.getElementById('addRevenueForm');
        const formData = new FormData(form);
        
        fetch('/api/revenue/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                branch: formData.get('branch') ? parseInt(formData.get('branch')) : null,
                revenue_type: formData.get('revenue_type'),
                quantity: parseFloat(formData.get('quantity')),
                unit: formData.get('unit'),
                price_per_unit: parseFloat(formData.get('price_per_unit')),
                date: formData.get('date')
            })
        })
        .then(response => response.json())
        .then(data => {
            bootstrap.Modal.getInstance(document.getElementById('addRevenueModal')).hide();
            loadRevenue();
            form.reset();
        });
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.addEventListener('DOMContentLoaded', loadRevenue);
</script>
{% endblock %}
