{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Expenses Tracking</h1>

<div class="row mb-4">
    <div class="col-md-8">
    </div>
    <div class="col-md-4 text-end">
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
            <i class="bi bi-plus-circle"></i> Add Expense
        </button>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Total Expenses</h5>
                <h2 id="totalExpenses">&#8369;0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Average Expense</h5>
                <h2 id="avgExpense">&#8369;0</h2>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h5>Expense Records</h5>
    </div>
    <div class="card-body">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Branch</th>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expensesBody">
            </tbody>
        </table>
    </div>
</div>

<!-- Add Expense Modal -->
<div class="modal fade" id="addExpenseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addExpenseForm">
                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select class="form-select" name="branch" required>
                            <option value="">Choose branch...</option>
                            {% for branch in branches %}
                                <option value="{{ branch.id }}">{{ branch.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expense Type</label>
                        <select class="form-select" name="expense_type" required>
                            <option value="feed">Feed</option>
                            <option value="medicine">Medicine</option>
                            <option value="equipment">Equipment</option>
                            <option value="labor">Labor</option>
                            <option value="utilities">Utilities</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-control" name="description" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" class="form-control" name="amount" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="saveExpenseBtn">Save Expense</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Expense Modal -->
<div class="modal fade" id="deleteExpenseModal" tabindex="-1" aria-labelledby="deleteExpenseModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteExpenseModalTitle">Delete Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Delete <strong id="deleteExpenseName"></strong> from your expense records?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteExpenseBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    let deletingExpenseId = null;

    function parseExpenseDate(dateString) {
        const [year, month, day] = dateString.split('-').map(Number);
        return new Date(year, month - 1, day);
    }

    function formatExpenseDate(dateString) {
        return parseExpenseDate(dateString).toLocaleDateString();
    }

    function formatExpenseMonth(dateString) {
        return parseExpenseDate(dateString).toLocaleDateString(undefined, {
            month: 'long',
            year: 'numeric'
        });
    }

    function addExpenseCell(row, text) {
        const cell = row.insertCell();
        cell.textContent = text;
        return cell;
    }

    function loadExpenses() {
        fetch('/api/expenses/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('expensesBody');
                tbody.innerHTML = '';
                let total = 0;

                const records = (data.results || []).slice().sort((a, b) => {
                    const branchA = (a.branch_name || 'Unassigned').toLowerCase();
                    const branchB = (b.branch_name || 'Unassigned').toLowerCase();
                    if (branchA !== branchB) return branchA.localeCompare(branchB);
                    return new Date(b.date) - new Date(a.date);
                });

                let currentBranch = null;
                records.forEach(expense => {
                    const branchName = expense.branch_name || 'Unassigned';
                    if (currentBranch !== branchName) {
                        currentBranch = branchName;
                        const branchRow = tbody.insertRow();
                        branchRow.className = 'table-light';
                        const branchCell = branchRow.insertCell();
                        branchCell.colSpan = 6;
                        branchCell.className = 'fw-bold text-uppercase small text-muted';
                        branchCell.textContent = branchName;
                    }

                    const row = document.createElement('tr');
                    addExpenseCell(row, branchName);
                    addExpenseCell(row, formatExpenseDate(expense.date));
                    addExpenseCell(row, expense.expense_type);
                    addExpenseCell(row, expense.description);
                    addExpenseCell(row, '\u20b1' + parseFloat(expense.amount).toFixed(2));

                    const actionsCell = row.insertCell();
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'btn btn-sm btn-danger';
                    deleteButton.type = 'button';
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', () => {
                        confirmDeleteExpense(expense.id, expense.description);
                    });
                    actionsCell.appendChild(deleteButton);

                    tbody.appendChild(row);
                    total += parseFloat(expense.amount);
                });

                document.getElementById('totalExpenses').textContent = '\u20b1' + total.toFixed(2);
                document.getElementById('avgExpense').textContent = '\u20b1' + (records.length > 0 ? (total / records.length).toFixed(2) : 0);
            });
    }

    document.getElementById('saveExpenseBtn').addEventListener('click', function() {
        const form = document.getElementById('addExpenseForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const formData = new FormData(form);

        fetch('/api/expenses/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                branch: formData.get('branch') ? parseInt(formData.get('branch')) : null,
                expense_type: formData.get('expense_type'),
                description: formData.get('description'),
                amount: parseFloat(formData.get('amount')),
                date: formData.get('date')
            })
        })
        .then(response => response.json())
        .then(data => {
            bootstrap.Modal.getInstance(document.getElementById('addExpenseModal')).hide();
            loadExpenses();
            form.reset();
        });
    });

    function confirmDeleteExpense(id, description) {
        deletingExpenseId = id;
        document.getElementById('deleteExpenseName').textContent = description;
        bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteExpenseModal')).show();
    }

    document.getElementById('confirmDeleteExpenseBtn').addEventListener('click', function() {
        if (!deletingExpenseId) {
            return;
        }

        fetch(`/api/expenses/${deletingExpenseId}/`, {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Unable to delete expense.');
            }

            bootstrap.Modal.getInstance(document.getElementById('deleteExpenseModal')).hide();
            deletingExpenseId = null;
            loadExpenses();
        })
        .catch(error => {
            showAppDialog(error.message, 'Unable to Delete Expense');
            console.error('Error deleting expense:', error);
        });
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.addEventListener('DOMContentLoaded', loadExpenses);
</script>
{% endblock %}
